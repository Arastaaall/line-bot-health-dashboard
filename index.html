<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrition Dashboard</title>
    <!-- LIFF SDK の読み込み -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { background-color: #121212; color: #00FFCC; font-family: sans-serif; padding: 20px; }
        h1 { font-size: 1.2rem; }
        .card { background: #1E1E1E; padding: 15px; border-radius: 8px; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>カロリー管理ダッシュボード</h1>
    <div class="card">
        <p>ユーザーID: <br><strong id="userId" style="color: #FF00FF;">取得中...</strong></p>
    </div>

    <script>
        // 先ほど作成したご自身のLIFF IDをここに直接貼り付けます
        const MY_LIFF_ID = "2011063084-sSBZXflI";
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxEl3VIa628NdVq3psrRXQXZhDcIS7MfofpM4IvHa3gEUBx2Y3_Uu4lqpnPS7DRTNtC/exec";

        async function main() {
            try {
                await liff.init({ liffId: MY_LIFF_ID });
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                document.getElementById('userId').textContent = profile.userId;

            // GASからデータを取得
                const response = await fetch(`${GAS_URL}?userId=${profile.userId}`);
                const data = await response.json();

            // 画面に表示する処理
                const displayArea = document.getElementById('userId'); // ここを適宜ID名変更
                displayArea.innerHTML = `
                    ID: ${profile.userId}<br>
                    今日の摂取カロリー: <strong>${data.length > 0 ? data[0][2] : 'データなし'} kcal</strong>
                `;
            } catch (err) {
                document.getElementById('userId').textContent = "エラー: " + err;
            }
        }

        main();
    </script>
</body>
</html>
