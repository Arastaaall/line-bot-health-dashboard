<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrition Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <div class="flex h-screen overflow-hidden">
        <!-- 左側サイドバー -->
        <aside class="w-64 bg-white border-r border-gray-200 hidden md:flex flex-col">
            <div class="p-6 border-b border-gray-100">
                <h1 class="text-xs font-bold tracking-wider text-emerald-600">NUTRITION</h1>
                <h2 class="text-lg font-extrabold text-gray-900">DASHBOARD</h2>
            </div>
            <nav class="flex-1 p-4 space-y-1 text-sm font-medium">
                <a href="#" class="flex items-center px-4 py-3 text-emerald-600 bg-emerald-50 rounded-lg">📊 ダッシュボード</a>
                <a href="#" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg">🥗 食事記録</a>
                <a href="#" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg">📈 栄養グラフ</a>
                <a href="#" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg">⚙️ 設定</a>
            </nav>
        </aside>

        <!-- メインコンテンツエリア -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            <!-- トップバー -->
            <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-6">
                <h2 class="text-xl font-bold text-gray-800">栄養バランスグラフ</h2>
                <div class="flex items-center space-x-3">
                    <span id="planBadge" class="text-xs font-medium bg-amber-100 text-amber-800 px-3 py-1 rounded-full">MEMBER</span>
                    <span id="userName" class="text-sm font-semibold">読み込み中...</span>
                </div>
            </header>

            <!-- ダッシュボードの中身 -->
            <div class="p-6 space-y-6">
                <!-- サマリーカード -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                        <p class="text-xs text-gray-400">接続ステータス</p>
                        <p class="text-sm font-mono text-gray-600 mt-1">User ID: <span id="userId" class="text-emerald-600 font-bold">取得中...</span></p>
                    </div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                        <p class="text-xs text-gray-400">過去7日間の平均摂取カロリー</p>
                        <p class="text-lg font-bold text-gray-800 mt-1">
                            <span id="avgCal">--</span> kcal / <span id="targetCal" class="text-gray-500 text-sm">目標 -- kcal</span>
                        </p>
                    </div>
                </div>

                <!-- 上段グラフ（PFC棒グラフ vs 栄養レーダー） -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- PFCバランス（実データ vs 目標/理想値） -->
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <h3 class="text-sm font-bold text-gray-700 mb-4">PFCバランス (過去7日間平均 vs 理想値)</h3>
                        <div class="relative h-64">
                            <canvas id="pfcChart"></canvas>
                        </div>
                    </div>

                    <!-- 栄養バランス（レーダーチャート） -->
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <h3 class="text-sm font-bold text-gray-700 mb-4">栄養バランス (過去7日間平均)</h3>
                        <div class="relative h-64">
                            <canvas id="radarChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- 中段グラフ（PFCの推移：過去7日間） -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="text-sm font-bold text-gray-700 mb-4">PFCの推移 (過去7日間)</h3>
                    <div class="relative h-64">
                        <canvas id="pfcTrendChart"></canvas>
                    </div>
                </div>

                <!-- 下段：1日あたりの平均摂取量（7日分カード） -->
                <div>
                    <h3 class="text-sm font-bold text-gray-700 mb-3">1日あたりの摂取量 (過去7日間)</h3>
                    <div id="dailyCards" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3">
                        <!-- JSで動的生成 -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const MY_LIFF_ID = "2011063084-sSBZXflI";
        // ★ご自身のGASデプロイURLに書き換えてください
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxEl3VIa628NdVq3psrRXQXZhDcIS7MfofpM4IvHa3gEUBx2Y3_Uu4lqpnPS7DRTNtC/exec";

        let pfcChartInstance = null;
        let radarChartInstance = null;
        let pfcTrendChartInstance = null;

        async function initLiff() {
            try {
                await liff.init({ liffId: MY_LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    document.getElementById('userId').textContent = profile.userId;
                    fetchDashboardData(profile.userId);
                } else {
                    document.getElementById('userId').textContent = "未ログイン（PCテスト表示）";
                    loadDummyData();
                }
            } catch (err) {
                document.getElementById('userId').textContent = "PC表示モード";
                loadDummyData();
            }
        }

        async function fetchDashboardData(userId) {
            try {
                const response = await fetch(`${GAS_URL}?userId=${userId}`);
                const data = await response.json();

                if (data.error) {
                    alert("データ取得エラー: " + data.error);
                    return;
                }

                // UI基本情報の更新
                document.getElementById('userName').textContent = (data.user.name || "ユーザー") + " さん";
                document.getElementById('avgCal').textContent = data.stats.avgCalories;
                document.getElementById('targetCal').textContent = `目標 ${data.ideal.calories} kcal`;
                
                if (data.user.isPremium) {
                    const badge = document.getElementById('planBadge');
                    badge.textContent = 'PRO MEMBER';
                    badge.className = 'text-xs font-medium bg-amber-100 text-amber-800 px-3 py-1 rounded-full';
                }

                // グラフおよびカード描画
                renderPfcChart(data.stats, data.ideal);
                renderRadarChart(data.stats, data.ideal);
                renderPfcTrendChart(data.daily);
                renderDailyCards(data.daily);

            } catch (err) {
                console.error("Fetch Error:", err);
            }
        }

        // 1. PFCバランス (実績 vs 理想目標値)
        function renderPfcChart(stats, ideal) {
            const ctx = document.getElementById('pfcChart').getContext('2d');
            if (pfcChartInstance) pfcChartInstance.destroy();

            pfcChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['P (たんぱく質)', 'F (脂質)', 'C (炭水化物)'],
                    datasets: [
                        {
                            label: '平均摂取量 (g)',
                            data: [stats.avgProtein, stats.avgFat, stats.avgCarbs],
                            backgroundColor: ['#3B82F6', '#F97316', '#10B981'],
                            borderRadius: 6
                        },
                        {
                            label: '理想目標値 (g)',
                            data: [ideal.protein, ideal.fat, ideal.carbs],
                            type: 'line',
                            borderColor: '#9CA3AF',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            pointBackgroundColor: '#9CA3AF',
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

// 2. 栄養バランス (8軸レーダーチャート)
function renderRadarChart(stats, ideal) {
    const ctx = document.getElementById('radarChart').getContext('2d');
    if (radarChartInstance) radarChartInstance.destroy();

    // 理想目標（100%）に対する各栄養素の達成率(%)
    const pPct = Math.round((stats.avgProtein / ideal.protein) * 100) || 0;
    const fPct = Math.round((stats.avgFat / ideal.fat) * 100) || 0;
    const cPct = Math.round((stats.avgCarbs / ideal.carbs) * 100) || 0;
    const fiberPct = Math.round(((stats.avgFiber || 14) / ideal.fiber) * 100);
    const vitAPct = Math.round(((stats.avgVitA || 680) / ideal.vitA) * 100);
    const vitCPct = Math.round(((stats.avgVitC || 85) / ideal.vitC) * 100);
    const calciumPct = Math.round(((stats.avgCalcium || 520) / ideal.calcium) * 100);
    const ironPct = Math.round(((stats.avgIron || 6.2) / ideal.iron) * 100);

    radarChartInstance = new Chart(ctx, {
        type: 'radar',
        data: {
            labels: [
                'たんぱく質', 
                '脂質', 
                '炭水化物', 
                '食物繊維', 
                'ビタミンA', 
                'ビタミンC', 
                'カルシウム', 
                '鉄'
            ],
            datasets: [
                {
                    label: '過去7日間の平均摂取量',
                    data: [pPct, fPct, cPct, fiberPct, vitAPct, vitCPct, calciumPct, ironPct],
                    borderColor: '#3B82F6',
                    backgroundColor: 'rgba(59, 130, 246, 0.2)',
                    pointBackgroundColor: '#3B82F6',
                    borderWidth: 2
                },
                {
                    label: '理想値 (目標100%)',
                    data: [100, 100, 100, 100, 100, 100, 100, 100],
                    borderColor: '#9CA3AF',
                    borderWidth: 1.5,
                    borderDash: [4, 4],
                    pointRadius: 0,
                    fill: false
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                r: {
                    beginAtZero: true,
                    max: 140,
                    ticks: {
                        stepSize: 20,
                        display: false
                    }
                }
            }
        }
    });
}

// ダミーデータ（PCテスト表示用）の更新
function loadDummyData() {
    const dummyIdeal = { calories: 2000, protein: 100, fat: 55, carbs: 275, fiber: 20, vitA: 800, vitC: 100, calcium: 650, iron: 7.5 };
    const dummyStats = { avgCalories: 1852, avgProtein: 112, avgFat: 78, avgCarbs: 94, avgFiber: 14, avgVitA: 680, avgVitC: 75, avgCalcium: 520, avgIron: 6.2 };
    const dummyDaily = [
        { label: '5/12(月)', calories: 1950, protein: 110, fat: 55, carbs: 270 },
        { label: '5/13(火)', calories: 1870, protein: 105, fat: 48, carbs: 265 },
        { label: '5/14(水)', calories: 1920, protein: 108, fat: 52, carbs: 275 },
        { label: '5/15(木)', calories: 1780, protein: 100, fat: 45, carbs: 240 },
        { label: '5/16(金)', calories: 1900, protein: 112, fat: 56, carbs: 260 },
        { label: '5/17(土)', calories: 1800, protein: 98, fat: 40, carbs: 250 },
        { label: '5/18(日)', calories: 1880, protein: 107, fat: 50, carbs: 262 }
    ];
    renderPfcChart(dummyStats, dummyIdeal);
    renderRadarChart(dummyStats, dummyIdeal);
    renderPfcTrendChart(dummyDaily);
    renderDailyCards(dummyDaily);
}
        // 3. PFC推移折れ線グラフ
        function renderPfcTrendChart(dailyData) {
            const ctx = document.getElementById('pfcTrendChart').getContext('2d');
            if (pfcTrendChartInstance) pfcTrendChartInstance.destroy();

            const labels = dailyData.map(d => d.label);
            const pData = dailyData.map(d => d.protein);
            const fData = dailyData.map(d => d.fat);
            const cData = dailyData.map(d => d.carbs);

            pfcTrendChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'P (たんぱく質)', data: pData, borderColor: '#3B82F6', tension: 0.2 },
                        { label: 'F (脂質)', data: fData, borderColor: '#F97316', tension: 0.2 },
                        { label: 'C (炭水化物)', data: cData, borderColor: '#10B981', tension: 0.2 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        // 4. 日別摂取量カード
        function renderDailyCards(dailyData) {
            const container = document.getElementById('dailyCards');
            container.innerHTML = '';

            dailyData.forEach(d => {
                const card = document.createElement('div');
                card.className = 'bg-white p-3 rounded-xl border border-gray-200 text-center shadow-sm';
                card.innerHTML = `
                    <p class="text-xs font-bold text-gray-500">${d.label}</p>
                    <p class="text-sm font-extrabold text-gray-800 my-1">${d.calories} <span class="text-xs font-normal">kcal</span></p>
                    <div class="text-[10px] text-gray-500 space-y-0.5">
                        <p>P: ${d.protein}g</p>
                        <p>F: ${d.fat}g</p>
                        <p>C: ${d.carbs}g</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ダミーデータ（PC開発テスト用）
        function loadDummyData() {
            const dummyIdeal = { calories: 2000, protein: 100, fat: 55, carbs: 275 };
            const dummyStats = { avgCalories: 1850, avgProtein: 95, avgFat: 60, avgCarbs: 230 };
            const dummyDaily = [
                { label: '5/12(月)', calories: 1950, protein: 110, fat: 55, carbs: 270 },
                { label: '5/13(火)', calories: 1870, protein: 105, fat: 48, carbs: 265 },
                { label: '5/14(水)', calories: 1920, protein: 108, fat: 52, carbs: 275 },
                { label: '5/15(木)', calories: 1780, protein: 100, fat: 45, carbs: 240 },
                { label: '5/16(金)', calories: 1900, protein: 112, fat: 56, carbs: 260 },
                { label: '5/17(土)', calories: 1800, protein: 98, fat: 40, carbs: 250 },
                { label: '5/18(日)', calories: 1880, protein: 107, fat: 50, carbs: 262 }
            ];
            renderPfcChart(dummyStats, dummyIdeal);
            renderRadarChart(dummyStats, dummyIdeal);
            renderPfcTrendChart(dummyDaily);
            renderDailyCards(dummyDaily);
        }

        initLiff();
    </script>
</body>
</html>
